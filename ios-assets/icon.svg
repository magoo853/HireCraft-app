<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3B2E"/>
      <stop offset="1" stop-color="#065F46"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- Stylized "H" formed by two pillars + crossbar, with an upward tick -->
  <g fill="none" stroke="#FFFFFF" stroke-width="92" stroke-linecap="round">
    <line x1="352" y1="300" x2="352" y2="724"/>
    <line x1="672" y1="300" x2="672" y2="724"/>
    <line x1="352" y1="512" x2="672" y2="512"/>
  </g>
  <!-- Emerald accent tick: career going up -->
  <polyline points="596,636 672,560 748,484" fill="none" stroke="#34D399" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="748" y1="484" x2="748" y2="586" stroke="#34D399" stroke-width="72" stroke-linecap="round"/>
  <line x1="748" y1="484" x2="646" y2="484" stroke="#34D399" stroke-width="72" stroke-linecap="round"/>
</svg>
